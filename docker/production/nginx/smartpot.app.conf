# /etc/nginx/sites-available/smartpot.app — PWA en smartpot.app; www redirige al dominio principal.
server {
    listen 80;
    listen [::]:80;
    server_name smartpot.app www.smartpot.app;
    return 301 https://smartpot.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.smartpot.app;

    ssl_certificate /etc/letsencrypt/live/smartpot.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpot.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://smartpot.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartpot.app;

    ssl_certificate /etc/letsencrypt/live/smartpot.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpot.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
