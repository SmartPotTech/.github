# /etc/nginx/sites-available/mqtt.smartpot.app — MQTT sobre WebSocket seguro (wss://mqtt.smartpot.app/mqtt).
# Las macetas usan MQTT sobre TLS directo en el puerto 8883; nginx no interviene en esa conexión.
map $http_upgrade $mqtt_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mqtt.smartpot.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mqtt.smartpot.app;

    ssl_certificate /etc/letsencrypt/live/smartpot.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpot.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mqtt_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }
}
