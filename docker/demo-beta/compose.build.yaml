# Override para construir los servicios migrados (API en Go, PostgreSQL + TimescaleDB, EMQX, Valkey, PWA en SolidJS
# y el simulador en Rust) desde los repositorios locales clonados junto a .github/ (igual que el entorno de desarrollo).
# El resto de componentes se siguen descargando de GHCR.
#   SmartPot/
#   ├── .github/docker/demo-beta/compose.yaml + compose.build.yaml   (este archivo)
#   ├── SmartPot-API-Go/  SmartPot-DB-Postgre/  SmartPot-Broker-EMQX/  SmartPot-Cache-Valkey/  SmartPot-Web-Solid/
#   └── SmartPot-DataGenerator-Rust/
#
# Uso:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --wait --build
name: smartpot-demo-beta

services:
  db-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-DB-Postgre
    pull_policy: build

  api-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-API-Go
    pull_policy: build

  broker-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-Broker-EMQX
    pull_policy: build

  cache-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-Cache-Valkey
    pull_policy: build

  web-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-Web-Solid
    pull_policy: build

  simulator-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-DataGenerator-Rust
    pull_policy: build

  ai-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-AI
    pull_policy: build

  trainer-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-Trainer
    pull_policy: build
