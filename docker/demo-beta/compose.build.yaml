# Override para construir los servicios migrados (API en Go, PostgreSQL + TimescaleDB, EMQX, Valkey, PWA en SolidJS,
# simulador en Rust e IA en Rust) desde los repositorios locales clonados junto a .github/ (igual que el entorno de desarrollo).
# El resto de componentes se siguen descargando de GHCR.
#   SmartPot/
#   ├── .github/docker/demo-beta/compose.yaml + compose.build.yaml   (este archivo)
#   ├── SmartPot-API/  SmartPot-DB/  SmartPot-Broker/  SmartPot-Cache/  SmartPot-Web/
#   └── SmartPot-DataGenerator/  SmartPot-AI/  SmartPot-Trainer/  SmartPot-MCP/
#
# Uso:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --wait --build
name: smartpot-demo-beta

services:
  db-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-DB
    pull_policy: build

  api-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-API
    pull_policy: build

  broker-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-Broker
    pull_policy: build

  cache-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-Cache
    pull_policy: build

  web-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-Web
    pull_policy: build

  simulator-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-DataGenerator
    pull_policy: build

  ai-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-AI
    pull_policy: build

  trainer-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-Trainer
    pull_policy: build

  mcp-smartpot:
    build: ${SMARTPOT_REPOS:-../../..}/SmartPot-MCP
    pull_policy: build
