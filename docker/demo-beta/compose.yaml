# Demo BETA de SmartPot: el mismo stack de la demo, pero con la API en Go, PostgreSQL + TimescaleDB, Valkey, el broker
# EMQX, la PWA en SolidJS y el simulador en Rust en lugar de Spring Boot, MongoDB, Redis, Mosquitto, React y Python. El resto
# de componentes (correo e IA) no cambian. Las contraseñas son públicas: solo para uso local. Las imágenes nuevas se publican
# en GHCR; mientras tanto, usa el override de construcción local (ver README):
#   docker compose -f compose.yaml -f compose.build.yaml up -d --wait --build
name: smartpot-demo-beta

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pull_policy: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# PostgreSQL necesita unos pocos caps para preparar su directorio de datos y bajar al usuario postgres; los caps de
# escalado (NET_ADMIN, SYS_ADMIN, etc.) siguen descartados.
x-db-hardening: &db-hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  pull_policy: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-demo-secrets:
  mqtt-admin: &mqtt-admin demo-mqtt-admin-password
  mqtt-authn-token: &mqtt-authn-token demo-broker-authn-token-123456
  broker-api-key: &broker-api-key demo-broker-api-key
  broker-api-secret: &broker-api-secret demo-broker-api-secret-123456
  ai-token: &ai-token demo-ai-token-for-local-use-only
  simulator-token: &simulator-token demo-simulator-token-for-local-use
  redis: &redis demo-redis-password-123
  db-app: &db-app demo-app-password-123
  mail: &mail demo-mail-password

services:
  db-smartpot:
    <<: *db-hardening
    image: ghcr.io/smartpottech/smartpot-db-postgre:latest
    container_name: smartpot-demo-beta-db
    cpus: "2.0"
    mem_limit: 1024m
    pids_limit: 256
    environment:
      POSTGRES_USER: smartpot-root
      POSTGRES_PASSWORD: demo-root-password-123
      POSTGRES_DB: smartpot
      SMARTPOT_DB_USERNAME: smartpot
      SMARTPOT_DB_PASSWORD: *db-app
      SMARTPOT_SEED_DEMO: "true"
    volumes:
      - db_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    networks:
      - internal

  cache-smartpot:
    <<: *hardening
    image: ghcr.io/smartpottech/smartpot-cache-valkey:latest
    container_name: smartpot-demo-beta-cache
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 128
    environment:
      # Valkey, el reemplazo libre de Redis. Acepta REDIS_PASSWORD por compatibilidad; la API aún la envía con ese nombre.
      VALKEY_PASSWORD: *redis
    volumes:
      # Socket IPC compartido en tmpfs para latencia sub-microsegundo
      - smartpot-ipc:/var/run/smartpot
    tmpfs:
      - /tmp
    networks:
      - internal

  mail-smartpot:
    <<: *hardening
    image: ghcr.io/smartpottech/smartpot-mail:latest
    container_name: smartpot-demo-beta-mail
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 64
    environment:
      MAIL_USERNAME: smartpot
      MAIL_PASSWORD: *mail
      MAILPIT_UI_USERNAME: admin
      MAILPIT_UI_PASSWORD: demo-mailpit-ui
    ports:
      - "127.0.0.1:8025:8025"
    tmpfs:
      - /tmp
    networks:
      - internal
      - public

  broker-smartpot:
    <<: *hardening
    # EMQX gestiona un directorio de datos mutable, así que este contenedor no puede ser de solo lectura.
    read_only: false
    image: ghcr.io/smartpottech/smartpot-broker-emqx:latest
    container_name: smartpot-demo-beta-broker
    cpus: "2.0"
    mem_limit: 1024m
    pids_limit: 512
    environment:
      MQTT_ADMIN_USERNAME: smartpot-api
      MQTT_ADMIN_PASSWORD: *mqtt-admin
      MQTT_AUTHN_TOKEN: *mqtt-authn-token
      MQTT_AUTHN_URL: http://api-smartpot:8091/internal/mqtt/authn
      MQTT_BROKER_API_KEY: *broker-api-key
      MQTT_BROKER_API_SECRET: *broker-api-secret
      MQTT_SCHEDULERS: "2"
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - broker_data:/opt/emqx/data
    tmpfs:
      - /tmp
    networks:
      - internal
      - public

  ai-smartpot:
    <<: *hardening
    image: ghcr.io/smartpottech/smartpot-ai:latest
    container_name: smartpot-demo-beta-ai
    cpus: "2.0"
    mem_limit: 512m
    pids_limit: 128
    environment:
      SMARTPOT_AI_TOKEN: *ai-token
      SMARTPOT_TRAINER_URL: http://trainer-smartpot:8001
      # Inferencia pura: el reentrenamiento vive desacoplado en trainer-smartpot
      LEARNING_CHECK_SECONDS: "0"
    volumes:
      - ai_data:/data
      - smartpot-ipc:/var/run/smartpot
    tmpfs:
      - /tmp
    networks:
      - internal

  trainer-smartpot:
    <<: *hardening
    image: ghcr.io/smartpottech/smartpot-trainer:latest
    container_name: smartpot-demo-beta-trainer
    cpus: "2.0"
    mem_limit: 1024m
    pids_limit: 256
    environment:
      SMARTPOT_TRAINER_TOKEN: *ai-token
      SMARTPOT_AI_TOKEN: *ai-token
      SMARTPOT_AI_URL: http://ai-smartpot:8000
      # La demo revisa cada 2 minutos si hay lecturas nuevas para reentrenar
      LEARNING_CHECK_SECONDS: "120"
      LEARNING_MIN_SAMPLES: "200"
      LEARNING_RETRAIN_EVERY: "300"
    volumes:
      - ai_data:/data
    tmpfs:
      - /tmp
    networks:
      - internal

  api-smartpot:
    <<: *hardening
    image: ghcr.io/smartpottech/smartpot-api-go:latest
    container_name: smartpot-demo-beta-api
    cpus: "2.0"
    mem_limit: 512m
    pids_limit: 256
    environment:
      WEB_BASE_URL: http://localhost:5173
      PUBLIC_API_URL: http://localhost:8091
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SMARTPOT_JWT_SECRET: demo-jwt-secret-for-local-use-only-0123456789
      SMARTPOT_AES_KEY: ZGVtby1vbmx5LXNtYXJ0cG90LWFlcy1rZXktMzJieXQ=
      # Única diferencia de conexión con la demo en Spring Boot: una URL de PostgreSQL en vez de MONGODB_URI.
      DATABASE_URL: postgres://smartpot:demo-app-password-123@db-smartpot:5432/smartpot?sslmode=disable
      CACHE_HOST: cache-smartpot
      CACHE_PASSWORD: *redis
      MAIL_HOST: mail-smartpot
      MAIL_USERNAME: smartpot
      MAIL_PASSWORD: *mail
      MAIL_SMTP_AUTH: "true"
      MQTT_BROKER_URI: tcp://broker-smartpot:1883
      MQTT_ADMIN_PASSWORD: *mqtt-admin
      MQTT_AUTHN_TOKEN: *mqtt-authn-token
      MQTT_BROKER_API_URL: http://broker-smartpot:18083
      MQTT_BROKER_API_KEY: *broker-api-key
      MQTT_BROKER_API_SECRET: *broker-api-secret
      MQTT_PUBLIC_HOST: localhost
      MQTT_PUBLIC_PORT: "1883"
      MQTT_WEBSOCKET_URL: ws://localhost:9001
      AI_BASE_URL: http://ai-smartpot:8000
      SMARTPOT_AI_TOKEN: *ai-token
      AI_EVALUATION_INTERVAL: PT1M
      AI_LEARNING_FLUSH_INTERVAL: PT15S
      SIMULATOR_BASE_URL: http://simulator-smartpot:8081
      SIMULATOR_TOKEN: *simulator-token
      # Opcional: con tu propio bot de @BotFather las alertas llegan por Telegram (sondeo, sin dirección pública).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MODE: polling
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      # Sockets UNIX UDS para IPC con SmartPot-AI y SmartPot-Cache-Valkey
      - smartpot-ipc:/var/run/smartpot
    tmpfs:
      - /tmp
    depends_on:
      db-smartpot:
        condition: service_healthy
      broker-smartpot:
        condition: service_healthy
      cache-smartpot:
        condition: service_healthy
    networks:
      - internal
      - public

  web-smartpot:
    <<: *hardening
    image: ghcr.io/smartpottech/smartpot-web-solid:latest
    container_name: smartpot-demo-beta-web
    cpus: "1.0"
    mem_limit: 128m
    pids_limit: 128
    environment:
      API_URL: http://localhost:8091
    ports:
      - "127.0.0.1:5173:8080"
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    networks:
      - public

  simulator-smartpot:
    <<: *hardening
    image: ghcr.io/smartpottech/smartpot-datagenerator-rust:latest
    container_name: smartpot-demo-beta-simulator
    cpus: "1.0"
    mem_limit: 128m
    pids_limit: 128
    environment:
      MQTT_HOST: broker-smartpot
      MQTT_PORT: "1883"
      SIMULATOR_DEVICES: 66f5a1000000000000000101:demo-lettuce-device-key-2026:LETTUCE,66f5a1000000000000000102:demo-tomato-device-key-2026:TOMATO
      SIMULATOR_INTERVAL_SECONDS: "15"
      SIMULATOR_TOKEN: *simulator-token
      RUST_LOG: info
    tmpfs:
      - /tmp
    depends_on:
      api-smartpot:
        condition: service_healthy
    # La red pública solo da salida a internet para consultar el clima; no publica puertos.
    networks:
      - internal
      - public

volumes:
  db_data:
  broker_data:
  ai_data:
  # Volumen compartido tmpfs en memoria para sockets UDS de ultra-baja latencia (/var/run/smartpot/*.sock)
  smartpot-ipc:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=1777"

networks:
  internal:
    internal: true
  public:
