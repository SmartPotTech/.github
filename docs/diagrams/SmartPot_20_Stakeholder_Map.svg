00000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:Segoe UI,Arial,sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="393" y="45" width="362" height="282" fill="#DDF5EA"/><text x="0" y="0" fill="#0B3D2B" font-size="17" dominant-baseline="hanging" text-anchor="middle" transform="translate(574, 50) rotate(0)">Administrar de cerca</text></g><g class="quadrant"><rect x="31" y="45" width="362" height="282" fill="#E3F2FB"/><text x="0" y="0" fill="#1F6FA0" font-size="17" dominant-baseline="hanging" text-anchor="middle" transform="translate(212, 50) rotate(0)">Mantener informados</text></g><g class="quadrant"><rect x="31" y="327" width="362" height="282" fill="#F2F7F4"/><text x="0" y="0" fill="#5B6B63" font-size="17" dominant-baseline="hanging" text-anchor="middle" transform="translate(212, 332) rotate(0)">Monitorear</text></g><g class="quadrant"><rect x="393" y="327" width="362" height="282" fill="#FDF4DD"/><text x="0" y="0" fill="#8A5A00" font-size="17" dominant-baseline="hanging" text-anchor="middle" transform="translate(574, 332) rotate(0)">Mantener satisfechos</text></g></g><g class="border"><line x1="30" y1="45" x2="756" y2="45" style="stroke: rgb(6, 122, 82); stroke-width: 2;"/><line x1="755" y1="46" x2="755" y2="608" style="stroke: rgb(6, 122, 82); stroke-width: 2;"/><line x1="30" y1="609" x2="756" y2="609" style="stroke: rgb(6, 122, 82); stroke-width: 2;"/><line x1="31" y1="46" x2="31" y2="608" style="stroke: rgb(6, 122, 82); stroke-width: 2;"/><line x1="393" y1="46" x2="393" y2="608" style="stroke: rgb(213, 227, 220); stroke-width: 1;"/><line x1="32" y1="327" x2="754" y2="327" style="stroke: rgb(213, 227, 220); stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><c