apiVersion: v1
kind: Namespace
metadata:
  name: smartpot
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: smartpot-secrets
  namespace: smartpot
type: Opaque
stringData:
  MONGO_ROOT_PASSWORD: k8s-root-password-local
  SMARTPOT_DB_PASSWORD: k8s-app-password-local
  MONGODB_URI: mongodb://smartpot:k8s-app-password-local@db-smartpot:27017/smartpot?authSource=smartpot
  REDIS_PASSWORD: k8s-redis-password-local
  MAIL_PASSWORD: k8s-mail-password-local
  MAILPIT_UI_PASSWORD: k8s-mailpit-ui-local
  MQTT_ADMIN_PASSWORD: k8s-mqtt-admin-password-local
  SMARTPOT_JWT_SECRET: k8s-jwt-secret-only-for-local-clusters-0123456789
  SMARTPOT_AES_KEY: ZGVtby1vbmx5LXNtYXJ0cG90LWFlcy1rZXktMzJieXQ=
  SMARTPOT_AI_TOKEN: k8s-ai-token-only-for-local-clusters
  SIMULATOR_TOKEN: k8s-simulator-token-only-for-local-clusters
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smartpot-config
  namespace: smartpot
data:
  MONGO_INITDB_ROOT_USERNAME: smartpot-root
  SMARTPOT_SEED_DEMO: "true"
  MAIL_USERNAME: smartpot
  MAILPIT_UI_USERNAME: admin
  MQTT_ADMIN_USERNAME: smartpot-api
  WEB_BASE_URL: http://localhost:30173
  PUBLIC_API_URL: http://localhost:30091
  CORS_ALLOWED_ORIGINS: http://localhost:30173
  REDIS_HOST: cache-smartpot
  MAIL_HOST: mail-smartpot
  MAIL_SMTP_AUTH: "true"
  MQTT_BROKER_URI: tcp://broker-smartpot:1883
  MQTT_PUBLIC_HOST: localhost
  MQTT_PUBLIC_PORT: "31883"
  MQTT_WEBSOCKET_URL: ws://localhost:30901
  AI_BASE_URL: http://ai-smartpot:8000
  AI_TIMEZONE: America/Bogota
  API_URL: http://localhost:30091
  MQTT_HOST: broker-smartpot
  MQTT_PORT: "1883"
  SIMULATOR_DEVICES: 66f5a1000000000000000101:demo-lettuce-device-key-2026:LETTUCE,66f5a1000000000000000102:demo-tomato-device-key-2026:TOMATO
  SIMULATOR_INTERVAL_SECONDS: "15"
  SIMULATOR_BASE_URL: http://simulator-smartpot:8081
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: smartpot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: broker-data
  namespace: smartpot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
# Lecturas reales seudonimizadas y modelos aprendidos por la IA.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-data
  namespace: smartpot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-smartpot
  namespace: smartpot
  labels:
    app: db-smartpot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db-smartpot
  template:
    metadata:
      labels:
        app: db-smartpot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: ghcr.io/smartpottech/smartpot-db:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          envFrom:
            - configMapRef:
                name: smartpot-config
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpot-secrets
                  key: MONGO_ROOT_PASSWORD
            - name: SMARTPOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpot-secrets
                  key: SMARTPOT_DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            exec:
              command: [ "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)" ]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [ "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)" ]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: db-data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
        - name: tmp
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: db-smartpot
  namespace: smartpot
spec:
  selector:
    app: db-smartpot
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-smartpot
  namespace: smartpot
  labels:
    app: cache-smartpot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-smartpot
  template:
    metadata:
      labels:
        app: cache-smartpot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: ghcr.io/smartpottech/smartpot-cache:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpot-secrets
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: cache-smartpot
  namespace: smartpot
spec:
  selector:
    app: cache-smartpot
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
