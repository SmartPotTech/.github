name: Snyk Security Scan

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/snyk-security.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/snyk-security.yml'
  schedule:
    # Escaneo semanal programado: lunes a las 07:00 UTC (02:00 AM COT)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Objetivo de análisis Snyk'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - beta
          - stable
          - iac
          - shared
      severity_threshold:
        description: 'Umbral mínimo de severidad para alertar o detener'
        required: true
        default: 'medium'
        type: choice
        options:
          - low
          - medium
          - high
          - critical
      enforce_gate:
        description: 'Bloquear y detener pipeline ante fallos (Security Gate estricto)'
        required: false
        default: false
        type: boolean
      auto_remediate_pr:
        description: 'Generar Pull Request de remediación automática si existen parches disponibles'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

env:
  SNYK_TOKEN: ${{ secrets.SNYK_PAT_ORG || secrets.SNYK_TOKEN }}
  SNYK_CFG_ORG: ${{ vars.SNYK_CFG_ORG || vars.SNYK_SLUG_ORG || '9c3602e7-da44-48d5-a4d1-5c2f09f7eafe' }}

jobs:
  check-secrets:
    if: github.actor != 'dependabot[bot]'
    name: Check Snyk Credentials
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Verify Snyk credentials availability
        id: check
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Credenciales de Snyk (SNYK_PAT_ORG) y organización ($SNYK_CFG_ORG) verificadas. Procediendo con el ciclo de seguridad DevSecOps."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Falta el secret SNYK_PAT_ORG (o SNYK_TOKEN) a nivel de organización. Configúralo en Settings > Secrets and variables > Actions."
            exit 1
          fi

  snyk-iac:
    name: Snyk IaC & Gatekeeper (Kubernetes & Compose)
    needs: check-secrets
    if: github.actor != 'dependabot[bot]' && (needs.check-secrets.outputs.configured == 'true' && (inputs.target == 'all' || inputs.target == 'iac' || github.event_name != 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master al 2026-10-31

      - name: Run Snyk IaC Test (Security Gate)
        run: |
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          echo "::notice::Ejecutando Snyk IaC Security Gate con umbral: $threshold"
          snyk iac test kubernetes/ docker/ \
            --org="${{ env.SNYK_CFG_ORG }}" \
            --severity-threshold="$threshold" \
            --sarif-file-output=snyk-iac.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk IaC Security Gate BLOQUEADO: Se detectaron fallas de configuración de severidad $threshold en manifiestos."
                exit 1
              else
                echo "::warning::Snyk IaC encontró advertencias de configuración en manifiestos."
              fi
            elif [ $code -eq 2 ] || [ $code -eq 3 ]; then
              echo "::warning::Snyk IaC aviso operacional o límite de plan alcanzado (código $code)."
            else
              echo "::warning::Snyk IaC finalizó con código $code."
            fi
          }

      - name: Upload IaC SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-iac.sarif') != ''
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      - name: Snyk IaC Continuous Monitoring Snapshot
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Publicando snapshot de IaC a Snyk Platform para monitoreo continuo..."
          snyk iac test kubernetes/ docker/ \
            --org="${{ env.SNYK_CFG_ORG }}" \
            --report || {
            echo "::warning::No se pudo publicar snapshot de IaC a Snyk Platform (límite de cuota o aviso operacional)."
          }

  snyk-beta-stack:
    name: Snyk SCA & Monitor (Microservices Stack B)
    needs: check-secrets
    if: github.actor != 'dependabot[bot]' && (needs.check-secrets.outputs.configured == 'true' && (inputs.target == 'all' || inputs.target == 'beta' || inputs.target == 'stable' || inputs.target == 'shared' || github.event_name != 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout SmartPot-API
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/SmartPot-API
          path: services/SmartPot-API
          persist-credentials: false

      - name: Checkout SmartPot-Web
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/SmartPot-Web
          path: services/SmartPot-Web
          persist-credentials: false

      - name: Checkout SmartPot-DataGenerator
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/SmartPot-DataGenerator
          path: services/SmartPot-DataGenerator
          persist-credentials: false

      - name: Checkout SmartPot-AI
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/SmartPot-AI
          path: services/SmartPot-AI
          persist-credentials: false

      - name: Checkout SmartPot-Trainer
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/SmartPot-Trainer
          path: services/SmartPot-Trainer
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'services/SmartPot-API/go.mod'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install SmartPot-Web dependencies
        run: |
          cd services/SmartPot-Web
          bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master al 2026-10-31

      # 1. Security Gate: SmartPot-API (Go)
      - name: Scan & Gate SmartPot-API (Go)
        run: |
          cd services/SmartPot-API
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-api-go.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos no mitigados en dependencias de SmartPot-API."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-API."
              fi
            elif [ $code -eq 2 ] || [ $code -eq 3 ]; then
              echo "::warning::Snyk aviso operacional o límite de plan alcanzado en SmartPot-API (código $code)."
            else
              echo "::warning::Snyk finalizó con código $code en SmartPot-API."
            fi
          }

      # 2. Security Gate: SmartPot-Web (SolidJS)
      - name: Scan & Gate SmartPot-Web (SolidJS)
        run: |
          cd services/SmartPot-Web
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-web-solid.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos en dependencias de SmartPot-Web."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-Web."
              fi
            elif [ $code -eq 2 ] || [ $code -eq 3 ]; then
              echo "::warning::Snyk aviso operacional o límite de plan alcanzado en SmartPot-Web (código $code)."
            else
              echo "::warning::Snyk finalizó con código $code en SmartPot-Web."
            fi
          }

      # 3. Security Gate: SmartPot-DataGenerator (Rust)
      - name: Scan SmartPot-DataGenerator (RustSec Cargo Audit)
        run: |
          cd services/SmartPot-DataGenerator
          cargo audit --format sarif > ../../snyk-datagenerator-rust.sarif || {
            code=$?
            echo "::warning::cargo-audit reportó avisos o vulnerabilidades en dependencias de SmartPot-DataGenerator (código $code)."
          }

      # 4. Security Gate: SmartPot-AI (Rust)
      - name: Scan SmartPot-AI (RustSec Cargo Audit)
        run: |
          cd services/SmartPot-AI
          cargo audit --format sarif > ../../snyk-ai-rust.sarif || {
            code=$?
            echo "::warning::cargo-audit reportó avisos o vulnerabilidades en dependencias de SmartPot-AI (código $code)."
          }

      # 5. Security Gate: SmartPot-Trainer (Python ML)
      - name: Scan & Gate SmartPot-Trainer (Python)
        run: |
          cd services/SmartPot-Trainer
          uv export --no-dev --no-hashes --no-header --no-annotate -o requirements.txt
          uv pip install --system -r requirements.txt
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test \
            --org="${{ env.SNYK_CFG_ORG }}" \
            --file=requirements.txt \
            --package-manager=pip \
            --command=python3 \
            --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-trainer.sarif \
            -- --allow-missing || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos en dependencias de SmartPot-Trainer."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-Trainer."
              fi
            elif [ $code -eq 2 ] || [ $code -eq 3 ]; then
              echo "::warning::Snyk aviso operacional o límite de plan alcanzado en SmartPot-Trainer (código $code)."
            else
              echo "::warning::Snyk finalizó con código $code en SmartPot-Trainer."
            fi
          }

      # 6. Alertar: Subir reportes SARIF
      - name: Upload SmartPot-API SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-api-go.sarif') != ''
        with:
          sarif_file: snyk-api-go.sarif
          category: snyk-api-go

      - name: Upload SmartPot-Web SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-web-solid.sarif') != ''
        with:
          sarif_file: snyk-web-solid.sarif
          category: snyk-web-solid

      - name: Upload SmartPot-DataGenerator SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-datagenerator-rust.sarif') != ''
        with:
          sarif_file: snyk-datagenerator-rust.sarif
          category: snyk-datagenerator-rust

      - name: Upload SmartPot-AI SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-ai-rust.sarif') != ''
        with:
          sarif_file: snyk-ai-rust.sarif
          category: snyk-ai-rust

      - name: Upload SmartPot-Trainer SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-trainer.sarif') != ''
        with:
          sarif_file: snyk-trainer.sarif
          category: snyk-trainer

      # 7. Monitorear: snyk monitor en rama principal, schedule o dispatch
      - name: Snyk Monitor Snapshots (Stack B)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Publicando snapshots a Snyk Platform para monitoreo continuo 24/7..."
          cd services/SmartPot-API
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --project-name="SmartPotTech/SmartPot-API" || true
          cd ../SmartPot-Web
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --project-name="SmartPotTech/SmartPot-Web" || true
          cd ../SmartPot-Trainer
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --file=requirements.txt --package-manager=pip --project-name="SmartPotTech/SmartPot-Trainer" || true

  snyk-remediation-pr:
    name: Snyk Automated Remediation PR
    needs: check-secrets
    if: github.actor != 'dependabot[bot]' && (needs.check-secrets.outputs.configured == 'true' && (inputs.auto_remediate_pr == true || github.event_name == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout central repository
        uses: actions/checkout@v7

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master al 2026-10-31

      - name: Check for Snyk Remediations & Auto-Fixes
        run: |
          echo "::notice::Evaluando vulnerabilidades con parches conocidos en la base de datos de Snyk Intel..."
          echo "El registro previo con 'snyk monitor' permite a Snyk Platform generar Automatic Fix PRs."
          echo "Adicionalmente, se registran proyectos para remediación continua."
