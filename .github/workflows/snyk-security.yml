name: Snyk Security Scan

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/snyk-security.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docker/**'
      - 'kubernetes/**'
      - '.github/workflows/snyk-security.yml'
  schedule:
    # Escaneo semanal programado: lunes a las 07:00 UTC (02:00 AM COT)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Objetivo de análisis Snyk'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - beta
          - stable
          - iac
          - shared
      severity_threshold:
        description: 'Umbral mínimo de severidad para alertar o detener'
        required: true
        default: 'medium'
        type: choice
        options:
          - low
          - medium
          - high
          - critical
      enforce_gate:
        description: 'Bloquear y detener pipeline ante fallos (Security Gate estricto)'
        required: false
        default: false
        type: boolean
      auto_remediate_pr:
        description: 'Generar Pull Request de remediación automática si existen parches disponibles'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

env:
  SNYK_TOKEN: ${{ secrets.SNYK_PAT_ORG || secrets.SNYK_TOKEN }}
  SNYK_CFG_ORG: ${{ vars.SNYK_CFG_ORG || vars.SNYK_SLUG_ORG || '9c3602e7-da44-48d5-a4d1-5c2f09f7eafe' }}

jobs:
  check-secrets:
    name: Check Snyk Credentials
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Verify Snyk credentials availability
        id: check
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Credenciales de Snyk (SNYK_PAT_ORG) y organización ($SNYK_CFG_ORG) verificadas. Procediendo con el ciclo de seguridad DevSecOps."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Falta el secret SNYK_PAT_ORG (o SNYK_TOKEN) a nivel de organización. Configúralo en Settings > Secrets and variables > Actions."
            exit 1
          fi

  snyk-iac:
    name: Snyk IaC & Gatekeeper (Kubernetes & Compose)
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true' && (inputs.target == 'all' || inputs.target == 'iac' || github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      # 1. Security Gate: Probar y Alertar / Detener
      - name: Run Snyk IaC Test (Security Gate)
        run: |
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          echo "::notice::Ejecutando Snyk IaC Security Gate con umbral: $threshold"
          snyk iac test kubernetes/ docker/ \
            --org="${{ env.SNYK_CFG_ORG }}" \
            --severity-threshold="$threshold" \
            --sarif-file-output=snyk-iac.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk IaC Security Gate BLOQUEADO: Se detectaron fallas de configuración de severidad $threshold en manifiestos."
                exit 1
              else
                echo "::warning::Snyk IaC encontró advertencias de configuración en manifiestos."
              fi
            else
              echo "::error::Fallo en la ejecución de Snyk IaC (código $code)."
              exit $code
            fi
          }

      # 2. Alertar: Cargar reporte SARIF a GitHub Code Scanning
      - name: Upload IaC SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-iac.sarif') != ''
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      # 3. Monitorear: snyk monitor continuo en rama principal, schedule o dispatch
      - name: Snyk IaC Continuous Monitoring Snapshot
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Publicando snapshot de IaC a Snyk Platform para monitoreo continuo..."
          snyk iac test kubernetes/ docker/ \
            --org="${{ env.SNYK_CFG_ORG }}" \
            --report || {
            echo "::warning::No se pudo publicar snapshot de IaC a Snyk Platform."
          }

  snyk-beta-stack:
    name: Snyk SCA & Monitor (Demo BETA Stack)
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true' && (inputs.target == 'all' || inputs.target == 'beta' || github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout SmartPot-API-Go
        uses: actions/checkout@v5
        with:
          repository: SmartPotTech/SmartPot-API-Go
          path: services/SmartPot-API-Go
          persist-credentials: false

      - name: Checkout SmartPot-Web-Solid
        uses: actions/checkout@v5
        with:
          repository: SmartPotTech/SmartPot-Web-Solid
          path: services/SmartPot-Web-Solid
          persist-credentials: false

      - name: Checkout SmartPot-DataGenerator-Rust
        uses: actions/checkout@v5
        with:
          repository: SmartPotTech/SmartPot-DataGenerator-Rust
          path: services/SmartPot-DataGenerator-Rust
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/SmartPot-API-Go/go.mod'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install SmartPot-Web-Solid dependencies
        run: |
          cd services/SmartPot-Web-Solid
          bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      # 1. Security Gate: SmartPot-API-Go
      - name: Scan & Gate SmartPot-API-Go (Go 1.26)
        run: |
          cd services/SmartPot-API-Go
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-api-go.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos no mitigados en dependencias de SmartPot-API-Go."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-API-Go."
              fi
            else
              exit $code
            fi
          }

      # 2. Security Gate: SmartPot-Web-Solid
      - name: Scan & Gate SmartPot-Web-Solid (SolidJS)
        run: |
          cd services/SmartPot-Web-Solid
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-web-solid.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos en dependencias de SmartPot-Web-Solid."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-Web-Solid."
              fi
            else
              exit $code
            fi
          }

      # 3. Security Gate: SmartPot-DataGenerator-Rust
      - name: Scan SmartPot-DataGenerator-Rust (RustSec Cargo Audit)
        run: |
          cd services/SmartPot-DataGenerator-Rust
          cargo audit --format sarif > ../../snyk-datagenerator-rust.sarif || {
            code=$?
            echo "::warning::cargo-audit reportó avisos o vulnerabilidades en dependencias de Rust (código $code)."
          }

      # 4. Alertar: Subir reportes SARIF
      - name: Upload SmartPot-API-Go SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-api-go.sarif') != ''
        with:
          sarif_file: snyk-api-go.sarif
          category: snyk-api-go

      - name: Upload SmartPot-Web-Solid SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-web-solid.sarif') != ''
        with:
          sarif_file: snyk-web-solid.sarif
          category: snyk-web-solid

      - name: Upload SmartPot-DataGenerator-Rust SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-datagenerator-rust.sarif') != ''
        with:
          sarif_file: snyk-datagenerator-rust.sarif
          category: snyk-datagenerator-rust

      # 5. Monitorear: snyk monitor en rama principal, schedule o dispatch
      - name: Snyk Monitor Snapshots (BETA Stack)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Publicando snapshots a Snyk Platform para monitoreo continuo 24/7..."
          cd services/SmartPot-API-Go
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --project-name="SmartPotTech/SmartPot-API-Go" || true
          cd ../SmartPot-Web-Solid
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --project-name="SmartPotTech/SmartPot-Web-Solid" || true

  snyk-stable-stack:
    name: Snyk SCA & Monitor (Demo Estable Stack)
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true' && (inputs.target == 'all' || inputs.target == 'stable' || github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout SmartPot-API
        uses: actions/checkout@v5
        with:
          repository: SmartPotTech/SmartPot-API
          path: services/SmartPot-API
          persist-credentials: false

      - name: Checkout SmartPot-Web
        uses: actions/checkout@v5
        with:
          repository: SmartPotTech/SmartPot-Web
          path: services/SmartPot-Web
          persist-credentials: false

      - name: Checkout SmartPot-DataGenerator
        uses: actions/checkout@v5
        with:
          repository: SmartPotTech/SmartPot-DataGenerator
          path: services/SmartPot-DataGenerator
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      # 1. Security Gate: SmartPot-API (Spring Boot)
      - name: Scan & Gate SmartPot-API (Spring Boot)
        run: |
          cd services/SmartPot-API
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-api-java.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos en dependencias de SmartPot-API."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-API."
              fi
            else
              exit $code
            fi
          }

      # 2. Security Gate: SmartPot-Web (React)
      - name: Scan & Gate SmartPot-Web (React)
        run: |
          cd services/SmartPot-Web
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test --org="${{ env.SNYK_CFG_ORG }}" --all-projects --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-web-react.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos en dependencias de SmartPot-Web."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-Web."
              fi
            else
              exit $code
            fi
          }

      # 3. Security Gate: SmartPot-DataGenerator (Python)
      - name: Scan & Gate SmartPot-DataGenerator (Python)
        run: |
          cd services/SmartPot-DataGenerator
          uv export --no-dev --no-hashes --no-header --no-annotate -o requirements.txt
          uv pip install --system -r requirements.txt
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test \
            --org="${{ env.SNYK_CFG_ORG }}" \
            --file=requirements.txt \
            --package-manager=pip \
            --command=python3 \
            --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-datagenerator.sarif \
            -- --allow-missing || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos en dependencias de SmartPot-DataGenerator."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-DataGenerator."
              fi
            else
              exit $code
            fi
          }

      # 4. Alertar: Subir SARIF
      - name: Upload SmartPot-API SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-api-java.sarif') != ''
        with:
          sarif_file: snyk-api-java.sarif
          category: snyk-api-java

      - name: Upload SmartPot-Web SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-web-react.sarif') != ''
        with:
          sarif_file: snyk-web-react.sarif
          category: snyk-web-react

      - name: Upload SmartPot-DataGenerator SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-datagenerator.sarif') != ''
        with:
          sarif_file: snyk-datagenerator.sarif
          category: snyk-datagenerator

      # 5. Monitorear: snyk monitor en rama principal, schedule o dispatch
      - name: Snyk Monitor Snapshots (Estable Stack)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Publicando snapshots a Snyk Platform para monitoreo continuo 24/7..."
          cd services/SmartPot-API
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --project-name="SmartPotTech/SmartPot-API" || true
          cd ../SmartPot-Web
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --project-name="SmartPotTech/SmartPot-Web" || true
          cd ../SmartPot-DataGenerator
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --file=requirements.txt --package-manager=pip --project-name="SmartPotTech/SmartPot-DataGenerator" || true

  snyk-shared-iot:
    name: Snyk SCA & Monitor (Componentes Compartidos & IoT)
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true' && (inputs.target == 'all' || inputs.target == 'shared' || github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SmartPot-AI
        uses: actions/checkout@v5
        with:
          repository: SmartPotTech/SmartPot-AI
          path: services/SmartPot-AI
          persist-credentials: false

      - name: Checkout SmartPot-IoT
        uses: actions/checkout@v5
        with:
          repository: SmartPotTech/SmartPot-IoT
          path: services/SmartPot-IoT
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      # 1. Security Gate: SmartPot-AI
      - name: Scan & Gate SmartPot-AI (FastAPI & ML)
        run: |
          cd services/SmartPot-AI
          uv export --no-dev --no-hashes --no-header --no-annotate -o requirements.txt
          uv pip install --system -r requirements.txt
          threshold="${{ inputs.severity_threshold || 'medium' }}"
          snyk test \
            --org="${{ env.SNYK_CFG_ORG }}" \
            --file=requirements.txt \
            --package-manager=pip \
            --command=python3 \
            --severity-threshold="$threshold" \
            --sarif-file-output=../../snyk-ai.sarif \
            -- --allow-missing || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Hallazgos en dependencias de SmartPot-AI."
                exit 1
              else
                echo "::warning::Hallazgos en dependencias de SmartPot-AI."
              fi
            else
              exit $code
            fi
          }

      # 2. Security Gate: SmartPot-IoT
      - name: Scan SmartPot-IoT (Firmware & Scripts)
        run: |
          cd services/SmartPot-IoT
          if [ -f pyproject.toml ]; then
            uv export --no-dev --no-hashes --no-header --no-annotate -o requirements.txt || true
            if [ -s requirements.txt ]; then
              uv pip install --system -r requirements.txt || true
              threshold="${{ inputs.severity_threshold || 'medium' }}"
              snyk test \
                --org="${{ env.SNYK_CFG_ORG }}" \
                --file=requirements.txt \
                --package-manager=pip \
                --command=python3 \
                --severity-threshold="$threshold" \
                --sarif-file-output=../../snyk-iot.sarif \
                -- --allow-missing || true
            else
              echo "::notice::El repositorio no contiene dependencias de producción externas (firmware MicroPython puro); escaneo omitido."
            fi
          fi

      # 3. Alertar: Subir SARIF
      - name: Upload SmartPot-AI SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-ai.sarif') != ''
        with:
          sarif_file: snyk-ai.sarif
          category: snyk-ai

      - name: Upload SmartPot-IoT SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-iot.sarif') != ''
        with:
          sarif_file: snyk-iot.sarif
          category: snyk-iot

      # 4. Monitorear: snyk monitor en rama principal, schedule o dispatch
      - name: Snyk Monitor Snapshot (SmartPot-AI)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Publicando snapshot de SmartPot-AI a Snyk Platform para monitoreo continuo 24/7..."
          cd services/SmartPot-AI
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --file=requirements.txt --package-manager=pip --project-name="SmartPotTech/SmartPot-AI" || true

  snyk-remediation-pr:
    name: Snyk Automated Remediation PR
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true' && (inputs.auto_remediate_pr == true || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout central repository
        uses: actions/checkout@v5

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Check for Snyk Remediations & Auto-Fixes
        run: |
          echo "::notice::Evaluando vulnerabilidades con parches conocidos en la base de datos de Snyk Intel..."
          echo "El registro previo con 'snyk monitor' permite a Snyk Platform generar Automatic Fix PRs."
          echo "Adicionalmente, se registran proyectos para remediación continua."
