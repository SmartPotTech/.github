name: QA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API (Go Echo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout API
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/SmartPot-API
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run tests
        run: |
          go vet ./...
          go test -v ./...

  web:
    name: Web (SolidJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Web
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/SmartPot-Web
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, type check, test and build
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build

  rust:
    name: ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repository: [ SmartPot-AI, SmartPot-DataGenerator ]
    steps:
      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/${{ matrix.repository }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test and check
        run: |
          cargo test --all-targets
          cargo clippy -- -D warnings

  python:
    name: ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repository: [ SmartPot-Trainer, SmartPot-MCP ]
    steps:
      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/${{ matrix.repository }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint and test
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen pytest

  containers:
    name: ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: SmartPot-Broker
            test: sh tests/smoke.sh smartpot-qa:ci
          - repository: SmartPot-DB
            test: sh tests/validate.sh smartpot-qa:ci true
          - repository: SmartPot-Cache
            test: sh tests/smoke.sh smartpot-qa:ci
          - repository: SmartPot-Mail
            test: sh tests/smoke.sh smartpot-qa:ci
    steps:
      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v7
        with:
          repository: SmartPotTech/${{ matrix.repository }}
          persist-credentials: false

      - name: Build image
        run: docker build -t smartpot-qa:ci .

      - name: Run smoke tests
        run: ${{ matrix.test }}

  e2e:
    name: End-to-End
    needs: [ api, web, rust, python, containers ]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout services
        run: |
          for repo in DB Cache Mail Broker AI API Web DataGenerator Trainer MCP; do
            git clone --depth 1 "https://github.com/SmartPotTech/SmartPot-$repo.git" "services/SmartPot-$repo"
          done

      - name: Build images
        run: |
          for repo in DB Cache Mail Broker AI API Web DataGenerator Trainer MCP; do
            name="$(echo "$repo" | tr '[:upper:]' '[:lower:]')"
            docker build -q -t "ghcr.io/smartpottech/smartpot-$name:latest" "services/SmartPot-$repo"
          done

      - name: Start demo stack
        env:
          # Bot de prueba sin salida a Telegram: la API valida el canal y el webhook sin llamar al servicio real.
          TELEGRAM_BOT_TOKEN: demo-telegram-token
          TELEGRAM_BOT_USERNAME: smartpot_demo_bot
          TELEGRAM_MODE: webhook
          TELEGRAM_WEBHOOK_SECRET: demo-telegram-webhook-secret
          TELEGRAM_API_BASE_URL: http://127.0.0.1:9
          # La suite encadena registro, login y recuperación desde la misma IP.
          AUTH_RATE_LIMIT_PER_MINUTE: "100"
        run: docker compose -f docker/demo/compose.yaml up -d --pull never --wait --wait-timeout 300

      - name: Run end-to-end checks
        env:
          SMARTPOT_API_URL: http://localhost:8091
          SMARTPOT_MCP_URL: http://localhost:8002
          SMARTPOT_MAILPIT_URL: http://localhost:8025
          SMARTPOT_MAILPIT_USERNAME: admin
          SMARTPOT_MAILPIT_PASSWORD: demo-mailpit-ui
          SMARTPOT_DEMO_EMAIL: demo@smartpot.app
          SMARTPOT_DEMO_PASSWORD: SmartPot2026
        run: python3 scripts/e2e.py

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker/demo/compose.yaml logs --tail 200

      - name: Stop demo stack
        if: always()
        run: docker compose -f docker/demo/compose.yaml down -v
