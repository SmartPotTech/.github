name: Demo QA

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Modo de ejecución de pruebas'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - e2e
          - smoke
  push:
    branches: [ "main" ]
    paths:
      - 'docker/demo/**'
      - '.github/workflows/demo-qa.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docker/demo/**'
      - '.github/workflows/demo-qa.yml'

permissions:
  contents: read

jobs:
  validate-demo:
    name: Validate Demo Stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Start Demo Stack
        env:
          # La suite encadena login y recuperación de contraseña desde la misma IP.
          AUTH_RATE_LIMIT_PER_MINUTE: "100"
        run: |
          docker compose -f docker/demo/compose.yaml up -d --wait --wait-timeout 300

      - name: Display Running Containers & Stats
        run: |
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          docker stats --no-stream

      - name: Run Centralized Test Suite
        env:
          SMARTPOT_API_URL: http://localhost:8091
          SMARTPOT_MCP_URL: http://localhost:8002
          SMARTPOT_MAILPIT_URL: http://localhost:8025
          SMARTPOT_MAILPIT_USERNAME: admin
          SMARTPOT_MAILPIT_PASSWORD: demo-mailpit-ui
          SMARTPOT_DEMO_EMAIL: demo@smartpot.app
          SMARTPOT_DEMO_PASSWORD: SmartPot2026
          SMARTPOT_BROKER_CONTAINER: smartpot-demo-broker
        run: |
          python3 docker/demo/test.py

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose -f docker/demo/compose.yaml logs --tail 200

      - name: Stop Demo Stack
        if: always()
        run: |
          docker compose -f docker/demo/compose.yaml down -v
